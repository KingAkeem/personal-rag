name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src benchmarks tests

      - name: Run local benchmark smoke test
        run: PYTHONPATH=src python benchmarks/run.py --provider hash --output /tmp/personal-rag-benchmark.json

      - name: Upload benchmark smoke result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-result
          path: /tmp/personal-rag-benchmark.json

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate NVIDIA Compose config
        run: docker compose -f docker-compose.nvidia.yml config

      - name: Validate AMD Compose config
        run: docker compose -f docker-compose.amd.yml config

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - test
      - compose
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --build-arg INSTALL_CPU_EMBEDDINGS=false -t personal-rag:ci .
